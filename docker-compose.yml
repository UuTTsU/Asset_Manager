volumes:
    postgres_data:
    mongodb_data:
    data1:

#minio settings config that will be same to every minio container
x-minio-common: &minio-common
  image: quay.io/minio/aistor/minio:latest
  expose:
    - "9000"
    - "9001"
  environment:
     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5

#--------SERVICES---------
# FASTAPI WEBAPP
services:
  web:
    build: .
    env_file:
      - .env
    ports:
     - "8000:80"
    volumes:
     - .:/app

#POSTGRESQL SERVER
  postgres:
    image: postgres:18
    container_name: assets_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

#MONGODB SERVER
  mongodb:
    image: mongo:latest
    container_name: assets-mongodb
    environment:
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

#MINIO OBJECT
  minio1:
    <<: *minio-common
    hostname: minio1
    command: server --console-address ":9001" /data --license /minio.license
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI / console
    volumes:
      - data1:/data
      - ./minio.license:/minio.license:ro







